<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 단어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF7; --ink:#16181D; --muted:#6B6F66; --faint:#A3A69C;
    --rule:#E3E0D7; --marker:#FFE566; --cobalt:#2140D9;
    --moss:#3B7A57; --clay:#B04434;
    --kr:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --en:'Fraunces',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--kr);
       font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px;margin:0 auto;padding:0 22px 96px;}

  header{padding:30px 0 18px;}
  .datestamp{font-size:13px;color:var(--faint);letter-spacing:.02em;}
  h1{font-family:var(--en);font-weight:600;font-size:38px;line-height:1.1;
     margin:6px 0 10px;letter-spacing:-.01em;}
  h1 .kr{font-family:var(--kr);font-weight:700;font-size:31px;}
  .subline{font-size:14px;color:var(--muted);margin:0;}

  nav{display:flex;gap:2px;margin:22px 0 0;border-bottom:1px solid var(--rule);}
  nav button{appearance:none;background:none;border:0;cursor:pointer;
    font-family:var(--kr);font-size:15px;color:var(--muted);
    padding:10px 14px;margin-bottom:-1px;border-bottom:2px solid transparent;}
  nav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink);}
  nav button:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;}
  .badge{display:inline-block;min-width:19px;padding:0 5px;margin-left:5px;
    background:var(--ink);color:var(--paper);border-radius:9px;
    font-size:11px;line-height:19px;text-align:center;font-weight:600;}
  nav button[aria-selected="true"] .badge{background:var(--cobalt);}

  .entry{display:grid;grid-template-columns:34px 1fr;gap:0 12px;
    padding:26px 0;border-bottom:1px solid var(--rule);}
  .num{font-family:var(--en);font-size:14px;color:var(--faint);padding-top:12px;}
  .headword{font-family:var(--en);font-size:31px;font-weight:600;line-height:1.25;
    display:inline;margin:0;padding:0 2px;
    background:linear-gradient(transparent 62%, var(--marker) 62%, var(--marker) 94%, transparent 94%);}
  .meta{font-size:13px;color:var(--muted);margin:8px 0 0;}
  .meta .ipa{font-family:var(--en);}
  .gloss{font-size:18px;font-weight:600;margin:6px 0 0;}
  .def{font-size:14px;color:var(--muted);margin:2px 0 0;}
  .ex{margin:16px 0 0;padding-left:13px;border-left:2px solid var(--rule);}
  .ex-en{font-family:var(--en);font-size:17px;line-height:1.55;margin:0;}
  .ex-ko{font-size:14px;color:var(--muted);margin:5px 0 0;}
  .tail{display:flex;flex-wrap:wrap;gap:6px 8px;margin:14px 0 0;}
  .syn{font-family:var(--en);font-size:13px;color:var(--muted);
    border:1px solid var(--rule);border-radius:2px;padding:2px 7px;}
  .tip{font-size:13px;color:var(--muted);margin:12px 0 0;}
  .tip b{color:var(--ink);font-weight:600;}

  .dots{display:flex;gap:5px;margin:24px 0 20px;}
  .dot{width:100%;height:3px;background:var(--rule);}
  .dot.done{background:var(--ink);} .dot.miss{background:var(--clay);}
  .qmeta{font-size:13px;color:var(--faint);margin:0 0 12px;}
  .qprompt{font-family:var(--en);font-size:27px;line-height:1.4;margin:0 0 4px;font-weight:400;}
  .qprompt.small{font-size:22px;}
  .qko{font-size:14px;color:var(--muted);margin:0 0 22px;}
  .choices{display:flex;flex-direction:column;gap:9px;margin:20px 0 0;}
  .choice{appearance:none;text-align:left;cursor:pointer;background:var(--paper);
    border:1px solid var(--rule);border-radius:3px;padding:14px 16px;
    font-family:var(--kr);font-size:16px;color:var(--ink);transition:border-color .12s;}
  .choice.en{font-family:var(--en);font-size:19px;}
  .choice:hover:not(:disabled){border-color:var(--ink);}
  .choice:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;}
  .choice:disabled{cursor:default;}
  .choice.right{border-color:var(--moss);background:#F0F6F1;color:var(--moss);font-weight:600;}
  .choice.wrong{border-color:var(--clay);background:#FBF0EE;color:var(--clay);}
  .reveal{margin:22px 0 0;padding:18px 0 0;border-top:1px solid var(--rule);}
  .verdict{font-size:15px;font-weight:600;margin:0 0 10px;}
  .verdict.ok{color:var(--moss);} .verdict.no{color:var(--clay);}

  .btn{appearance:none;cursor:pointer;border:0;border-radius:3px;
    background:var(--ink);color:var(--paper);font-family:var(--kr);
    font-size:15px;font-weight:600;padding:13px 24px;}
  .btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule);}
  .btn:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;}
  .empty{padding:64px 0;}
  .empty p{color:var(--muted);margin:0 0 20px;}
  .statgrid{display:flex;gap:28px;flex-wrap:wrap;padding:30px 0 0;}
  .stat .v{font-family:var(--en);font-size:30px;font-weight:600;line-height:1;}
  .stat .k{font-size:13px;color:var(--muted);margin-top:6px;}
  .foot{display:flex;justify-content:space-between;align-items:center;
    margin:34px 0 0;padding-top:18px;border-top:1px solid var(--rule);font-size:14px;}
  .foot a{color:var(--muted);text-decoration:none;cursor:pointer;}
  .foot a:hover{color:var(--ink);text-decoration:underline;}
  .hidden{display:none;}
  .spinner{color:var(--muted);font-size:15px;padding:60px 0;}
  .err{color:var(--clay);font-size:14px;padding:40px 0;line-height:1.7;}
  .reset{margin-top:40px;font-size:13px;color:var(--faint);}
  .reset button{appearance:none;background:none;border:0;padding:0;cursor:pointer;
    color:var(--faint);text-decoration:underline;font-family:var(--kr);font-size:13px;}

  @media (max-width:480px){
    h1{font-size:31px;} h1 .kr{font-size:26px;}
    .headword{font-size:27px;}
    .qprompt{font-size:22px;} .qprompt.small{font-size:19px;}
    .entry{grid-template-columns:24px 1fr;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="datestamp" id="datestamp">불러오는 중</p>
    <h1><span class="kr">오늘의 단어</span></h1>
    <p class="subline" id="subline"></p>
    <nav role="tablist">
      <button role="tab" id="tab-today" aria-selected="true">단어</button>
      <button role="tab" id="tab-review" aria-selected="false">복습<span class="badge hidden" id="review-count">0</span></button>
      <button role="tab" id="tab-stats" aria-selected="false">기록</button>
    </nav>
  </header>
  <main id="main"><p class="spinner">불러오는 중…</p></main>
  <div class="foot" id="foot"></div>
</div>

<script>
/* ------------------------------------------------------------------
   데이터는 data/words.json 한 파일에서만 가져온다.
   Apps Script가 매일 아침 이 파일을 GitHub에 커밋한다.
   복습 진도(SRS)는 각자 브라우저 localStorage에 저장되므로
   같은 페이지를 여러 사람이 써도 진도가 섞이지 않는다.
------------------------------------------------------------------ */
var SRS_KEY   = 'daily-english.srs.v1';
var INTERVALS = [1, 2, 4, 7, 15, 30, 60];
var REVIEW_MAX = 12;

var DB = null;      // words.json
var DATE = null;    // 보고 있는 날짜
var TAB = 'today';
var QUIZ = [], QI = 0, RESULTS = [];

/* ---------- 유틸 ---------- */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-'
       + String(d.getMonth()+1).padStart(2,'0') + '-'
       + String(d.getDate()).padStart(2,'0');
}
function shift(dateStr, n){
  var p = dateStr.split('-');
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-'
       + String(d.getMonth()+1).padStart(2,'0') + '-'
       + String(d.getDate()).padStart(2,'0');
}
function daysBetween(a, b){
  var pa=a.split('-'), pb=b.split('-');
  return Math.round((new Date(+pb[0],+pb[1]-1,+pb[2]) - new Date(+pa[0],+pa[1]-1,+pa[2]))/86400000);
}
function shuffle(arr){
  var a = arr.slice();
  for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}

/* ---------- 진도 저장 ---------- */
function loadSrs(){
  try { return JSON.parse(localStorage.getItem(SRS_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveSrs(s){
  try { localStorage.setItem(SRS_KEY, JSON.stringify(s)); }
  catch(e){ /* 시크릿 모드 등에서 저장 불가. 세션 동안은 정상 동작 */ }
}
/** words.json에 새로 들어온 단어를 진도표에 등록 */
function syncSrs(){
  var s = loadSrs(), changed = false;
  DB.words.forEach(function(w){
    if (!s[w.word]){
      s[w.word] = { box:0, due:shift(w.date,1), ok:0, no:0, added:w.date };
      changed = true;
    }
  });
  if (changed) saveSrs(s);
  return s;
}

/* ---------- 퀴즈 구성 ---------- */
function buildQuiz(dateStr){
  var s = syncSrs();
  var byWord = {};
  DB.words.forEach(function(w){ byWord[w.word] = w; });

  var due = Object.keys(s)
    .filter(function(k){
      var r = s[k];
      return byWord[k] && r.added !== dateStr && r.due <= dateStr;
    })
    .sort(function(a,b){ return s[a].due < s[b].due ? -1 : 1; })
    .slice(0, REVIEW_MAX);

  var pool = DB.words.filter(function(w){ return w.meaning_ko; });

  return due.map(function(k, idx){
    var w = byWord[k], r = s[k];
    var mode = (idx % 2 === 0) ? 'meaning' : 'cloze';
    if (mode === 'cloze' && !w.example_blank) mode = 'meaning';

    // 오답은 같은 품사에서 우선 고른다
    var cands = pool.filter(function(x){
      return x.word !== w.word && x.meaning_ko !== w.meaning_ko;
    });
    var same = cands.filter(function(x){ return x.pos === w.pos; });
    var d = shuffle(same.length >= 3 ? same : cands).slice(0, 3);
    while (d.length < 3) d.push({ word:'—', meaning_ko:'해당 없음' });

    var choices = (mode === 'meaning')
      ? shuffle([w.meaning_ko].concat(d.map(function(x){ return x.meaning_ko; })))
      : shuffle([w.word].concat(d.map(function(x){ return x.word; })));

    return {
      mode: mode, word: w.word, pos: w.pos, ipa: w.ipa,
      prompt: mode === 'meaning' ? w.word : w.example_blank,
      promptKo: mode === 'meaning' ? '' : w.example_ko,
      choices: choices,
      answer: mode === 'meaning' ? w.meaning_ko : w.word,
      meaning_ko: w.meaning_ko, example_en: w.example_en,
      example_ko: w.example_ko, tip: w.tip,
      box: r.box, daysSince: daysBetween(r.added, dateStr)
    };
  });
}

function record(word, ok){
  var s = loadSrs();
  var r = s[word];
  if (!r) return;
  if (ok){ r.box = Math.min(r.box + 1, INTERVALS.length - 1); r.ok++; }
  else   { r.box = 0; r.no++; }
  r.due = shift(todayStr(), INTERVALS[r.box]);
  saveSrs(s);
}

/* ---------- 로딩 ---------- */
function boot(){
  fetch('data/words.json?t=' + Date.now(), { cache:'no-store' })
    .then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(json){
      DB = json;
      if (!DB.words || !DB.words.length) throw new Error('데이터가 비어 있습니다.');
      var q = new URLSearchParams(location.search).get('d');
      var t = todayStr();
      var avail = DB.days.filter(function(d){ return d <= t; });
      DATE = (q && DB.days.indexOf(q) >= 0) ? q
           : (avail[avail.length-1] || DB.days[DB.days.length-1]);
      render();
    })
    .catch(function(e){
      document.getElementById('main').innerHTML =
        '<p class="err">단어 데이터를 불러오지 못했습니다. (' + esc(e.message) + ')<br>'
      + '아직 첫 단어가 올라오기 전이거나, 배포가 진행 중일 수 있습니다. '
      + '몇 분 뒤 새로고침해 주세요.</p>';
    });
}

function wordsOf(dateStr){
  return DB.words.filter(function(w){ return w.date === dateStr; });
}

/* ---------- 렌더 ---------- */
function render(){
  var t = todayStr();
  var words = wordsOf(DATE);
  QUIZ = buildQuiz(DATE);
  if (QI > QUIZ.length) { QI = 0; RESULTS = []; }

  document.getElementById('datestamp').textContent =
    DATE + (DATE === t ? '' : ' · 지난 기록');

  var badge = document.getElementById('review-count');
  badge.textContent = QUIZ.length;
  badge.className = QUIZ.length ? 'badge' : 'badge hidden';

  var st = stats();
  document.getElementById('subline').textContent =
    words.length + '개 · 복습 ' + QUIZ.length + '개'
    + (st.streak ? ' · 연속 ' + st.streak + '일째' : '');

  ['today','review','stats'].forEach(function(x){
    document.getElementById('tab-'+x).setAttribute('aria-selected', String(x===TAB));
  });

  var m = document.getElementById('main');
  if (TAB === 'today')  m.innerHTML = viewToday(words);
  if (TAB === 'review') m.innerHTML = viewReview();
  if (TAB === 'stats')  m.innerHTML = viewStats(st);
  renderFoot();
}

function viewToday(words){
  if (!words.length){
    return '<div class="empty"><p>이 날짜에는 단어가 없습니다.</p></div>';
  }
  return words.map(function(w, i){
    var syn = (w.synonyms||[]).map(function(s){
      return '<span class="syn">' + esc(s) + '</span>'; }).join('');
    return '<article class="entry"><div class="num">' + (i+1) + '</div><div>'
      + '<h2 style="margin:0"><span class="headword">' + esc(w.word) + '</span></h2>'
      + '<p class="meta">' + esc(w.pos)
        + (w.ipa ? ' <span class="ipa">' + esc(w.ipa) + '</span>' : '') + '</p>'
      + '<p class="gloss">' + esc(w.meaning_ko) + '</p>'
      + (w.definition_en ? '<p class="def">' + esc(w.definition_en) + '</p>' : '')
      + '<div class="ex"><p class="ex-en">' + esc(w.example_en) + '</p>'
      + '<p class="ex-ko">' + esc(w.example_ko) + '</p></div>'
      + (syn ? '<div class="tail">' + syn + '</div>' : '')
      + (w.tip ? '<p class="tip"><b>메모</b> ' + esc(w.tip) + '</p>' : '')
      + '</div></article>';
  }).join('');
}

function viewReview(){
  if (!QUIZ.length){
    return '<div class="empty"><p>지금 복습할 단어가 없습니다. '
         + '오늘 배운 단어는 내일 여기로 올라옵니다.</p></div>';
  }
  if (QI >= QUIZ.length){
    var right = RESULTS.filter(Boolean).length;
    return '<div class="empty">'
      + '<h2 style="font-family:var(--en);font-size:32px;margin:0 0 10px;font-weight:600;">'
      + right + ' / ' + QUIZ.length + '</h2>'
      + '<p>틀린 단어는 내일 다시 나옵니다. 맞힌 단어는 간격을 두고 돌아옵니다.</p>'
      + '<button class="btn ghost" data-act="tab" data-tab="today">오늘 단어 보기</button></div>';
  }

  var it = QUIZ[QI];
  var isCloze = it.mode === 'cloze';
  var choices = it.choices.map(function(c, i){
    return '<button class="choice' + (isCloze ? ' en' : '') + '" '
         + 'data-act="answer" data-i="' + i + '">' + esc(c) + '</button>';
  }).join('');

  return '<div class="dots">' + dots() + '</div>'
    + '<p class="qmeta">' + (QI+1) + ' / ' + QUIZ.length
      + ' · ' + it.daysSince + '일 전에 배운 단어'
      + (it.box > 0 ? ' · ' + it.box + '단계' : '') + '</p>'
    + '<p class="qprompt' + (isCloze ? ' small' : '') + '">' + esc(it.prompt) + '</p>'
    + '<p class="qko">' + esc(isCloze ? it.promptKo : (it.pos + ' ' + it.ipa)) + '</p>'
    + '<div class="choices" id="choices">' + choices + '</div>'
    + '<div id="reveal"></div>';
}

function dots(){
  return QUIZ.map(function(_, i){
    var c = 'dot';
    if (i < RESULTS.length) c += RESULTS[i] ? ' done' : ' miss';
    return '<span class="' + c + '"></span>';
  }).join('');
}

function answer(i){
  var it = QUIZ[QI];
  var ok = it.choices[i] === it.answer;
  RESULTS.push(ok);
  record(it.word, ok);

  var btns = document.querySelectorAll('#choices .choice');
  for (var k=0;k<btns.length;k++){
    btns[k].disabled = true;
    if (it.choices[k] === it.answer) btns[k].classList.add('right');
    else if (k === i) btns[k].classList.add('wrong');
  }

  document.getElementById('reveal').innerHTML =
      '<div class="reveal">'
    + '<p class="verdict ' + (ok?'ok':'no') + '">' + (ok?'맞았습니다':'틀렸습니다') + '</p>'
    + '<p style="margin:0 0 4px;"><span class="headword">' + esc(it.word) + '</span></p>'
    + '<p class="gloss" style="margin-top:10px;">' + esc(it.meaning_ko) + '</p>'
    + '<div class="ex"><p class="ex-en">' + esc(it.example_en) + '</p>'
    + '<p class="ex-ko">' + esc(it.example_ko) + '</p></div>'
    + (it.tip ? '<p class="tip"><b>메모</b> ' + esc(it.tip) + '</p>' : '')
    + '<p style="margin:22px 0 0;"><button class="btn" data-act="next">다음</button></p>'
    + '</div>';
}

function stats(){
  var s = loadSrs();
  var keys = Object.keys(s);
  var ok=0, no=0, mastered=0, days={};
  keys.forEach(function(k){
    ok += s[k].ok; no += s[k].no;
    if (s[k].box >= 4) mastered++;
    days[s[k].added] = true;
  });
  var streak = 0, cur = todayStr();
  if (!days[cur]) cur = shift(cur, -1);
  while (days[cur]){ streak++; cur = shift(cur, -1); }
  return {
    totalWords: keys.length, totalDays: Object.keys(days).length,
    streak: streak, mastered: mastered,
    accuracy: (ok+no) ? Math.round(ok/(ok+no)*100) : null
  };
}

function viewStats(st){
  function cell(v,k){
    return '<div class="stat"><div class="v">'+v+'</div><div class="k">'+k+'</div></div>';
  }
  return '<div class="statgrid">'
    + cell(st.totalWords, '누적 단어') + cell(st.totalDays, '학습한 날')
    + cell(st.streak, '연속 일수') + cell(st.mastered, '장기기억 단계')
    + cell(st.accuracy == null ? '—' : st.accuracy + '%', '복습 정답률')
    + '</div>'
    + '<p class="tip" style="margin-top:34px;">복습은 라이트너 방식입니다. '
    + '맞히면 1일 → 2일 → 4일 → 7일 → 15일 → 30일 간격으로 다시 나오고, '
    + '틀리면 처음 단계로 돌아가 다음 날 바로 나옵니다.</p>'
    + '<p class="tip">진도는 이 브라우저에만 저장됩니다. 다른 PC나 시크릿 모드에서는 '
    + '따로 계산됩니다.</p>'
    + '<p class="reset"><button data-act="reset">진도 초기화</button></p>';
}

function renderFoot(){
  var i = DB.days.indexOf(DATE);
  var prev = i > 0 ? DB.days[i-1] : null;
  var next = i >= 0 && i < DB.days.length-1 ? DB.days[i+1] : null;
  document.getElementById('foot').innerHTML =
      (prev ? '<a data-act="go" data-d="'+prev+'">← '+prev+'</a>' : '<span></span>')
    + (next ? '<a data-act="go" data-d="'+next+'">'+next+' →</a>'
            : '<span style="color:var(--faint)">최신</span>');
}

/* ---------- 이벤트 (위임) ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.dataset.act;

  if (act === 'answer'){ answer(+el.dataset.i); }
  else if (act === 'next'){ QI++; render(); window.scrollTo(0,0); }
  else if (act === 'tab'){ TAB = el.dataset.tab; render(); }
  else if (act === 'go'){
    DATE = el.dataset.d; QI = 0; RESULTS = [];
    history.replaceState(null,'','?d='+DATE);
    render(); window.scrollTo(0,0);
  }
  else if (act === 'reset'){
    if (confirm('복습 진도를 모두 지웁니다. 계속할까요?')){
      localStorage.removeItem(SRS_KEY); QI=0; RESULTS=[]; render();
    }
  }
});

['today','review','stats'].forEach(function(x){
  document.getElementById('tab-'+x).addEventListener('click', function(){
    TAB = x; if (x === 'review'){ QI = 0; RESULTS = []; } render();
  });
});

boot();
</script>
</body>
</html>
